name: CI

on:
  push:
    branches: [master]
  pull_request:

# starkcore is not published to Clojars yet, so the build installs it from a
# sibling checkout into the runner's ~/.m2 before resolving this project's
# dependencies. `lein deps` would otherwise fail on com.starkinfra/starkcore.
env:
  CORE_CLOJURE_REF: master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: starkinfra/sdk-clojure

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: starkinfra/core-clojure
          ref: ${{ env.CORE_CLOJURE_REF }}
          path: starkinfra/core-clojure

      # The repository's Actions policy allows GitHub-owned actions only, each
      # pinned to a sha. Leiningen therefore comes from its own release script,
      # pinned to the commit of the 2.11.2 tag, rather than from a third-party
      # action; the script bootstraps the matching standalone jar on first run.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Leiningen 2.11.2
        run: |
          sudo curl -fsSL -o /usr/local/bin/lein \
            https://raw.githubusercontent.com/technomancy/leiningen/795c3a5d68de7a2465582da4184c42d7bd065c76/bin/lein
          sudo chmod +x /usr/local/bin/lein
          lein version

      - name: Install starkcore from the sibling checkout
        run: lein install
        working-directory: starkinfra/core-clojure

      - name: Resolve dependencies
        run: lein deps
        working-directory: starkinfra/sdk-clojure

      - name: Compile every namespace
        run: lein check
        working-directory: starkinfra/sdk-clojure

      # The default selector excludes ^:sandbox, so this job needs no
      # credentials. `lein test :sandbox` is the credentialed suite and is not
      # run here.
      - name: Offline suite
        run: lein test
        working-directory: starkinfra/sdk-clojure
